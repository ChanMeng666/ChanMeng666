name: Validate Profile Data

# Schema-validate data/profile/*.yaml on every PR. Prevents broken data from
# reaching main and triggering a failed rebuild.

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate.mjs"
      - "scripts/check-*.mjs"
      - "scripts/lib/**"
      - "cv/sections/**"
      # The .docx/.txt generators parse the ATS entry point directly, so a
      # formatting drift in either must reach check:ats below.
      - "cv/chan-meng-cv-ats.typ"
      - "cv/*.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run validate
      # Freshness SLA: deterministic logic errors always fail; under --strict an
      # overdue flagship/active entry also fails — you're already editing the
      # data, review the overdue item (npm run reviewed -- "<section.key>").
      - run: node scripts/check-freshness.mjs --strict
      # CV anchor facts (date ranges) must agree with 10-career.yaml.
      - run: node scripts/check-cv-sync.mjs --strict
      # The ATS resume's .docx/.txt are PARSED out of cv/chan-meng-cv-ats.typ.
      # A structural change there must fail here — not months later, an hour
      # before an application, when the exports are actually rebuilt. Needs no
      # typst, so it is cheap to gate every PR with.
      - run: npm run check:ats
      # The prose gate. Nothing else in this workflow reads the copy itself, and
      # the two failures that motivated it were both invisible to every check
      # above: a banned word sitting in a project tagline, and one stale shard
      # entry whose numbers had been copied onto five surfaces. Error-class rules
      # only under --strict: a banned word, a claim-shaped number that exists in
      # no shard, and a LinkedIn field over its platform cap (LinkedIn truncates
      # silently, so nobody notices without counting). Style findings stay
      # advisory and never block.
      - run: node scripts/check-copy.mjs --strict
      - run: npm run build
      - name: Check that committed outputs match what build would generate
        run: |
          if git diff --quiet README.md llms.txt llms-full.txt dist/profile.json public/cv-llms.txt public/cv.jsonld; then
            echo "✓ Committed outputs are in sync with data/."
          else
            echo "✗ Committed README.md / llms.txt / llms-full.txt / dist/profile.json"
            echo "  / public/cv-llms.txt / public/cv.jsonld are stale relative to"
            echo "  data/profile/*.yaml. Run 'npm run build' locally and commit the"
            echo "  regenerated files, or rely on the build-readme.yml workflow to"
            echo "  do it after merge."
            git diff --stat README.md llms.txt llms-full.txt dist/profile.json public/cv-llms.txt public/cv.jsonld
          fi
