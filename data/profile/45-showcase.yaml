# =============================================================================
# PRODUCT FILMS — which product publicly displays which promo film
# =============================================================================
# The register of promo films that are actually ON SHOW, one row per product.
# It records what chanmeng.org plays today (2d-portfolio: src/data/showcase.ts,
# src/data/work.ts, src/data/resume.tsx, public/work/films/) so the database
# and the site stay in step. It renders on no surface by itself.
#
# RULES (Chan, 2026-10-06):
#   - ONE film per product on show. A product may have several film repos (they
#     coexist, none replaces another); only `filmRepo` is displayed and the
#     rest are listed under `notDisplayed` with the reason. Extra cuts of the
#     displayed film (other lengths, vertical) are not separate films.
#   - Changing which film a product shows = edit this row AND the site, then
#     `npm run check:ecosystem`.
#   - `filmRepo` and every `notDisplayed[].filmRepo` must be a repo of role
#     promo-film (or demo) in docs/ecosystem/lineage.yaml; `projectId` a
#     projects[].id; `showcaseId` a showcase[].id. Enforced by
#     scripts/check-ecosystem.mjs. Most film repos are private: name them,
#     never link them.
#   - `kind: product` rows are subject to the one-per-product rule. `kind:
#     event` (an event promo) and `kind: personal-brand` are separate works,
#     recorded here so nothing the site plays is missing from the database.
#   - A film on the site is not automatically README / extended-CV craft
#     evidence: that needs its own `showcase` entry above (frames, collage).
#   - ONE EXCEPTION (Chan, 2026-10-09): chanmeng.org/films is the filmography
#     and shows every version, including the films listed under
#     `notDisplayed` here (not the ArchLang narrated demo). That page is fed
#     by `films` in 46-films.yaml, where `primary: true` must name the same
#     film repo as this register. Everywhere else the rule stands.
# =============================================================================
