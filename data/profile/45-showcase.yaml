# =============================================================================
# SHOWCASE — craft evidence beyond code
# =============================================================================
# The deliverables a visitor can LOOK at: typeset PDF reports, promo films,
# pitch decks, event slides, newsletters, data-transformation records and
# SEO/GEO proof. Rendered as the README "What I make beyond code" block, the
# extended CV `x-craft` chapter, and chanmeng.org/work.
#
# Two keys:
#   showcaseCapabilities — one row per capability, in display order. Each owns
#     ONE collage (public/evidence/collages/<id>.jpg, rendered from
#     evidence/collages/<id>.html by `npm run build:collages`).
#   showcase — one row per artefact; `capability` must be a showcaseCapabilities
#     id, `relatedWorkId` a work[].id, `relatedProjectId` a projects[].id. The
#     build fails on any broken reference.
#
# CONFIDENTIALITY (decided by Chan, 2026-09-24) — do not widen without asking:
#   - GAVIGO pitch deck: cover, problem and solution slides ONLY. No slide with
#     a figure, and never the gated deck URL.
#   - She Sharp H1 2026 funder report: public screenshots + downloadable PDF OK
#     (public release confirmed by Chan, 2026-09-24).
#     The Youth Tech chapter page (photos of children) is not used in any
#     collage.
#   - She Sharp transformation record: a cover card and the headline numbers
#     already public in work.she-sharp. No PDF, no chapter content.
#   - The internal She Sharp metrics record is never copied here.
#
# VIDEOS: MP4s are NOT committed (10-30 MB each). Each film carries
# `videos[]` with `url: null` until Chan uploads the file through GitHub's
# user-attachments and pastes the returned URL here; templates render a
# placeholder while `url` is null. `watchUrl` is separate: the public page
# (YouTube, LinkedIn post) where the finished film can be watched today.
#
# The extended CV (cv/extended.typ x-craft) does NOT use the collages: it
# typesets each item's text natively and shows the raw `sources` frames, so
# keep sources and the chapter in step when one changes.
# =============================================================================

showcaseCapabilities:
  - id: pdf-report
    label: Typeset PDF reports
    blurb: Funder-grade reports typeset in code (Typst), where every figure traces to a named source.
    collage: /public/evidence/collages/pdf-report.jpg
  - id: promo-film
    label: Promo films
    blurb: Short promotional films built in Remotion as code, scored and cut to the beat, in every aspect ratio a channel needs.
    collage: /public/evidence/collages/promo-film.jpg
  - id: pitch-deck
    label: Pitch decks
    blurb: Investor-facing HTML decks in a Swiss grid, built for a founder to present and send.
    collage: /public/evidence/collages/pitch-deck.jpg
  - id: slides
    label: Event slides
    blurb: Live, data-driven presentation decks that run a room for two days.
    collage: /public/evidence/collages/slides.jpg
  - id: newsletter
    label: Newsletters
    blurb: Email newsletters designed, written and sent from infrastructure the sender owns.
    collage: /public/evidence/collages/newsletter.jpg
  - id: data-transformation
    label: Digital transformation
    blurb: Turning an organisation's scattered SaaS data into a structured, owned, auditable record.
    collage: /public/evidence/collages/data-transformation.jpg
  - id: seo-geo
    label: SEO & GEO
    blurb: Making work findable by search engines and by the AI models people now ask instead.
    collage: /public/evidence/collages/seo-geo.jpg

