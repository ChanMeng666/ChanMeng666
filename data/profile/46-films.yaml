# =============================================================================
# FILMS — every finished film Chan has made, one row per film
# =============================================================================
# The complete filmography: product films, brand films, the event promo and the
# music videos. It is the source of chanmeng.org/films (the page that shows all
# of them): `npm run build:films-data` writes dist/films.json from the rows
# marked `onFilmsPage: true`, and 2d-portfolio's `scripts/sync-films.mjs`
# copies that file into the site. Edit a film here, never in the site.
#
# HOW THIS RELATES TO `productFilms` (45-showcase.yaml):
#   - `productFilms` decides which ONE film a product shows on the home page,
#     /work, /teaching, /about and the README. That rule is unchanged.
#   - /films is the one place that shows every version (Chan, 2026-10-09), so a
#     product may have several rows here. `primary: true` marks the row that
#     `productFilms` displays; the others are earlier or alternative films.
#
# RULES
#   - `repo` must be a promo-film, demo or music-video repo in
#     docs/ecosystem/lineage.yaml; `projectId` a projects[].id; `collection` a
#     filmCollections[].id. Enforced by scripts/check-ecosystem.mjs. Most film
#     repos are private: name them, never link them.
#   - Music videos (Chan, 2026-10-09): shown on YouTube and on chanmeng.org/films,
#     and nowhere else: not the README, a CV, LinkedIn copy or another page of
#     the site. Their copy says how each film is drawn and how it is made, not
#     what the album is about. Keep both credits: the songs are hers (made with
#     Suno); "no image or video generation models" is a claim about the PICTURE.
#   - ArchCanvas copy law holds here too: "AI architectural designer", never
#     "AI architect"; never "buildable", "permit-ready", "code-compliant" or
#     "in seconds". GAVIGO: no figures beyond the film's own; CORDE: the app is
#     in use at CORDE, the film is not endorsed by CORDE.
#   - `media` paths are site paths. `/work/films/*` are files in 2d-portfolio's
#     public/; `/media/*` is the R2 bucket `chanmeng-media`, served by the
#     site's Worker. `hls` is an adaptive stream (1080p / 720p / 360p),
#     `mp4` one progressive 720p file. `seconds` is the length of what plays.
#   - `youtubeId` only for PUBLIC uploads (youtube/channel.yaml is the register).
# =============================================================================

filmCollections:
  - id: archcanvas-feature-shorts
    kind: series
    title: ArchCanvas feature shorts
    repo: ChanMeng666/archcanvas-promo-video
    projectId: archcanvas
    summary: Six 21 to 29 second shorts, one product feature each, cut from the same session on the live product as the 92-second film and reusing its on-screen copy word for word. Each exists in 16:9 and 9:16.

  - id: october-rain-february-line
    kind: songs
    title: "October Rain · February Line"
    repo: ChanMeng666/october-rain-february-line-mv
    projectId: october-rain-february-line-mv
    summary: Two films for two of Chan's songs. Every frame is drawn by code, a web page draws frame t, headless Chrome captures it and ffmpeg adds the song.
    credits: "Songs by Chan Meng, made with Suno. Production method, frame renderer and cel brush engine from the open-source mg-styles-15 library (MIT). No image or video generation model is used for the picture."

  - id: anti-marriage-universe
    kind: album
    title: Anti-Marriage Universe
    titleZh: 反婚宇宙
    repo: ChanMeng666/anti-marriage-universe-mv
    projectId: anti-marriage-universe-mv
    summary: A trilogy, one blind date in a café seen three times, hers, his and from above, each film in its own visual style. Every frame is drawn in code and cut to the song's beat grid.
    credits: "Music, lyrics and recordings by Chan Meng. Visual styles and engine modules from the open-source Lemo-Opuscar style library (MIT). No video generation and no stock footage."

  - id: memory-amber-2022
    kind: album
    title: Memory Amber 2022
    titleZh: 记忆琥珀2022
    repo: ChanMeng666/memory-amber-2022-mv
    projectId: memory-amber-2022-mv
    summary: Eight films for one album, a memoir of one year, with one film per song and a different way of drawing for each. Three rules run through all eight, one amber light per film, one white that changes meaning from film to film, and no faces.
    credits: "Songs and lyrics by Chan Meng, generated with Suno. Renderer, timing tools and method adapted from the open-source mg-styles-15 library (MIT); several films adapt techniques from the Lemo-Opuscar style library. No image or video generation model, no photograph and no footage is used for the picture."

