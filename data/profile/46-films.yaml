    titleZh: 反婚宇宙
    repo: ChanMeng666/anti-marriage-universe-mv
    repoPublic: true
    projectId: anti-marriage-universe-mv
    summary: A trilogy, one blind date in a café seen three times, hers, his and from above, each film in its own visual style. Every frame is drawn in code and cut to the song's beat grid.
    credits: "Music, lyrics and recordings by Chan Meng. Visual styles and engine modules from the open-source Lemo-Opuscar style library (MIT). No video generation and no stock footage."

  - id: memory-amber-2022
    kind: album
    title: Memory Amber 2022
    titleZh: 记忆琥珀2022
    repo: ChanMeng666/memory-amber-2022-mv
    repoPublic: false
    projectId: memory-amber-2022-mv
    summary: Eight films for one album, a memoir of one year, with one film per song and a different way of drawing for each. Three rules run through all eight, one amber light per film, one white that changes meaning from film to film, and no faces.
    credits: "Songs and lyrics by Chan Meng, generated with Suno. Renderer, timing tools and method adapted from the open-source mg-styles-15 library (MIT); several films adapt techniques from the Lemo-Opuscar style library. No image or video generation model, no photograph and no footage is used for the picture."

  - id: a-coffee-for-one
    kind: songs
    title: A Coffee for One
    titleZh: 独身主义的咖啡
    repo: ChanMeng666/solo-coffee-mv
    repoPublic: true
    projectId: solo-coffee-mv
    summary: One film for one of Chan's songs. Python paints the watercolour layers, a web page animates them as a pure function of time, headless Chrome captures every frame and ffmpeg adds the song.
    credits: "Song and lyrics by Chan Meng, made with Suno. Painted with numpy, OpenCV and Pillow, timed with faster-whisper, librosa, pypinyin and OpenCC, rendered with puppeteer-core and ffmpeg. Pen-and-wash habits and one transition idea are adapted from the notes of the Lemo-Opuscar style library, with no code copied. No image or video generation model, no photograph and no footage is used for the picture."

  - id: save-me-a-little-of-today
    kind: songs
    title: Save Me a Little of Today
    titleZh: 把今天留一小块给我
    repo: ChanMeng666/a-little-of-today-mv
    repoPublic: true
    projectId: a-little-of-today-mv
    summary: One film for one of Chan's songs. Python paints the watercolour layers for thirteen sets, a web page animates them as a pure function of time, headless Chrome captures every frame and ffmpeg adds the song.
    credits: "Song and lyrics by Chan Meng, made with Suno. Painted with numpy, OpenCV and Pillow, timed with faster-whisper, librosa, pypinyin and OpenCC, rendered with puppeteer-core and ffmpeg; the watercolour engine, render harness and timing tools are carried over from A Coffee for One. No image or video generation model, no photograph and no footage is used for the picture."

  - id: liu-zhongjing-in-watercolour
    kind: explainer-series
    title: Liu Zhongjing in Watercolour
    titleZh: 劉仲敬思想 · 水彩短片
    repo: ChanMeng666/lzj-watercolor-films
    repoPublic: true
    projectId: lzj-watercolor-films
    summary: Fourteen short explainer films on the thought of the historian and political theorist Liu Zhongjing, one framework each, built as an argument in seven to thirteen chapters with Traditional Chinese captions. Every captioned quotation is verbatim from his writings, lectures and interviews and names its source on screen. Python paints the watercolour layers, a web page animates them as a pure function of time, headless Chrome captures every frame and ffmpeg adds the score.
    credits: "Ideas and quotations: Liu Zhongjing. Concept, painting engine, animation and scores by Chan Meng, built with Claude Code. Scores played back from recorded instruments (VSCO 2 Community Edition, Salamander Grand Piano, VCSL, Karoryfer) with a sampler adapted from the Lemo-Opuscar library (MIT); fonts LXGW WenKai TC and Noto Serif TC (SIL OFL). No image or video generation model, no photograph and no footage is used for the picture."

  - id: liu-zhongjing-history-in-maps
    kind: explainer-series
    title: Liu Zhongjing's History, in Maps
    titleZh: 劉仲敬史觀 · 地圖紀錄片
    repo: ChanMeng666/lzj-history-maps
    repoPublic: true
    projectId: lzj-history-maps
    summary: Eleven animated map documentaries in three series, This Land (the East Asian mainland), The Republic (the People's Republic) and The World, that retell history as Liu Zhongjing reads it in ten to twelve chapters with Traditional Chinese captions. Every captioned quotation is verbatim and names its source on screen. A WebGL and Canvas globe built from Natural Earth data flies between regions, colours historical polities and draws campaigns, trade streams, walls and fronts; headless Chrome captures every frame and ffmpeg adds the score.
    credits: "Ideas and quotations: Liu Zhongjing. Concept, map renderer, animation and scores by Chan Meng, built with Claude Code. Map data from Natural Earth (public domain), drawn with d3-geo and topojson (ISC); present-day borders are a stage for historical regions, not a claim about sovereignty. Scores played back from recorded instruments (VSCO 2 Community Edition, Salamander Grand Piano, VCSL, Karoryfer) with a sampler adapted from the Lemo-Opuscar library (MIT); fonts LXGW WenKai TC and Noto Serif TC (SIL OFL). No image or video generation model, no photograph and no footage is used for the picture."

