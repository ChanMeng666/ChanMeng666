# =============================================================================
# FILMS — every finished film Chan has made, one row per film
# =============================================================================
# The complete filmography: product films, brand films, the event promo and the
# music videos. It is the source of chanmeng.org/films (the page that shows all
# of them): `npm run build:films-data` writes dist/films.json from the rows
# marked `onFilmsPage: true`, and 2d-portfolio's `scripts/sync-films.mjs`
# copies that file into the site. Edit a film here, never in the site.
#
# HOW THIS RELATES TO `productFilms` (45-showcase.yaml):
#   - `productFilms` decides which ONE film a product shows on the home page,
#     /work, /teaching, /about and the README. That rule is unchanged.
#   - /films is the one place that shows every version (Chan, 2026-10-09), so a
#     product may have several rows here. `primary: true` marks the row that
#     `productFilms` displays; the others are earlier or alternative films.
#
# RULES
#   - `repo` must be a promo-film, demo or music-video repo in
#     docs/ecosystem/lineage.yaml; `projectId` a projects[].id; `collection` a
#     filmCollections[].id. Enforced by scripts/check-ecosystem.mjs. A film repo
#     may be linked only when it is public (docs/STATE.md "Film repos", 2026-10-19).
#     Every row carries `repoPublic` (true = https://github.com/<repo> may be
#     linked); check-ecosystem fails when it disagrees with the repo's visibility
#     in lineage.yaml.
#   - Music videos (Chan, 2026-10-09; the wall added 2026-10-10): shown on YouTube,
#     on chanmeng.org/films and as poster tiles on the README film wall
#     (public/readme/films.svg), and nowhere else: not a project card, a CV,
#     LinkedIn copy or another page of the site. Their copy says how each film is drawn and how it is made, not
#     what the album is about. Keep both credits: the songs are hers (made with
#     Suno); "no image or video generation models" is a claim about the PICTURE.
#   - ArchCanvas copy law holds here too: "AI architectural designer", never
#     "AI architect"; never "buildable", "permit-ready", "code-compliant" or
#     "in seconds". GAVIGO: no figures beyond the film's own; CORDE: the app is
#     carried on for CORDE by the teammate who took it over (say no more about
#     its use than that), the film is not endorsed by CORDE.
#   - `media` paths are site paths. `/work/films/*` are files in 2d-portfolio's
#     public/; `/media/*` is the R2 bucket `chanmeng-media`, served by the
#     site's Worker. `hls` is an adaptive stream (1080p / 720p / 360p),
#     `mp4` one progressive 720p file. `seconds` is the length of what plays.
#   - `youtubeId` only for PUBLIC uploads (youtube/channel.yaml is the register).
# =============================================================================

