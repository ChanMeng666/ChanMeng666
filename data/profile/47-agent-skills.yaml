# =============================================================================
# AGENT SKILLS — every agent skill Chan has made, one row per repo or product
# =============================================================================
# The place to answer "which skills has Chan built, what is each for, how is it
# installed". Facts about a repo's history stay in docs/ecosystem/lineage.yaml;
# career copy stays in the project shards (`projectId` joins them).
#
# NAMING (Chan, 2026-10-31): a released skill carries her id. The repo and the
# skill share one name, `chanmeng-<what-it-does>`, with no -skill suffix: the
# owner in the address already says GitHub, and the name is what a user sees in
# ~/.claude/skills. A repo that holds several skills prefixes each of them. A new
# skill is named this way from its first commit.
#
# scope
#   released   its own repo, made for others to install. Must be named chanmeng-*.
#   product    ships inside a product under the product's name, through npm and
#              its plugin marketplace. Exempt: renaming needs an npm release,
#              which only Chan can publish (`namingException` says why). Its
#              marketplace already reads chanmeng-*.
#   internal   lives in one repo's .claude/skills for that repo's own work; not
#              offered to anyone, so no prefix.
#
# Not here on purpose: logo-generator-skill (a working copy of someone else's
# skill) and paper-review (archived research).
#
# RULES
#   - A link may be built from `repo` only when `repoPublic` is true.
#   - `projectId` must be a projects[].id. `formerRepo` and `formerSkillNames`
#     exist so an old name in a blog post, a listing or a chat can be found.
#   - scripts/check-ecosystem.mjs fails when a skill repo in lineage.yaml is
#     missing here, or a released row does not start with chanmeng-.
#   - Showing a skill on a surface is decided elsewhere (docs/STATE.md,
#     90-meta.yaml); a row here shows nothing.
# =============================================================================

