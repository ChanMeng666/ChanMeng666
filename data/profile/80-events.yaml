    photos:
      - src: /public/photos/events/2026-08-07-aotearoa-ai-hackathon-festival-mc-opening.jpg
        alt: "Chan Meng MCing the opening of the Aotearoa AI Hackathon Festival 2026 from the AUT podium, the festival title slide projected behind her"
        caption: "Opening the two-day festival, AUT City Campus, 7 August 2026."
        date: "2026-08-07"
      - src: /public/photos/events/2026-08-07-aotearoa-ai-hackathon-festival-mc-karakia.jpg
        alt: "Chan Meng at the AUT podium during the Karakia Tīmatanga that opened the festival"
        caption: "Karakia Tīmatanga — the opening karakia."
        date: "2026-08-07"
    summary: |
      **MC'd the opening** of the two-day 2026 festival — welcome and Karakia
      Tīmatanga from the AUT podium — and returned as a technical mentor, a year
      after the 2025 edition that produced the first Outstanding Mentor Award.
      **Received the Outstanding Mentor Award a second consecutive year** for
      the 2026 festival (`awards[Outstanding Mentor Award (2026)]` — recorded on
      Chan's own testimony; see the self-attestation note there). She was in the
      room in **two capacities at once**: on the public mentor roster in her own
      right, and as part of the **She Sharp team** that ran the venue, working
      mentor recruitment alongside the organising group in the weeks before.
      On the public roster she is billed as **Founding Engineer, ArchCanvas**,
      alongside mentors from AUT, Fisher & Paykel Healthcare, Southern Cross
      Health Society, Red Hat and Possibl.ai.

      **How many mentors — two figures, both real.** The host's public "Meet
      the Mentors" roster lists **17**; the organisers' own running count
      reached **28**, which includes volunteers and staff who registered under
      the mentor code. Neither is wrong; they count different things, and this
      database records both rather than picking the flattering one.

      **Scale and outcome.** 125 registered. **Twelve teams** built against five
      real-world UN SDG themes; free online pre-event training ran through July,
      and roughly **a third of participants had never been to a hackathon
      before**. On the Saturday each team pitched for five minutes to a local
      judging panel: one team took the venue prize with two runners-up, and the
      winning pitch went forward to national judging. **Four national finalists**
      pitch at the Aotearoa AI Summit, 8–9 September 2026 in Wellington. The
      festival's voice-first event assistant is `ai-hackathon-assistant`,
      relaunched for 2026.

      A second thread outlived the festival. One of the problem statements —
      **Accessible UI Generation for Developers** — was set by **My Life My
      Voice**, a disability-led NZ organisation whose *AI For People* programme
      argues for AI built to work for disabled people rather than the reverse.
      Its brief names the same bottleneck the `a11y-loop` project attacks:
      accessibility as a manual, late audit sitting outside the tools developers
      use, auditing what is already broken instead of preventing it. With the
      competition closed and nothing being scored, Chan sent that finished,
      MIT-licensed project to the organisation unsolicited on **2026-08-11** —
      contact form plus an email to `info@mylifemyvoice.org.nz`, offering a free
      walkthrough and a roadmap open to feedback from disabled testers — and
      published a LinkedIn post crediting them the same day.

      **That handover was adopted on 2026-09-04.** Timothy Young, CTO of My
      Life My Voice, told Chan the organisation would take `a11y-loop` into its
      own project development and that the collaboration would continue, with
      Chan giving technical guidance to members of their team. Adoption plus an
      ongoing advisory arrangement — not a paid contract, not a formal
      partnership, not an endorsement, and not a production deployment; the
      whole account is Chan's own (see the SELF-ATTESTED note above the
      `a11y-loop` entry). Full record:
      `projects[a11y-loop].narrative.outcomes` and the `my-life-my-voice`
      organisation entry.

