    relatedWorkId: she-sharp
    relatedProjectId: her-waka
    summary: |
      **Authored the programme solo** — the teaching platform and all four
      workshops' content — then took part in the sessions themselves as a
      **panel speaker and technical mentor**. Four in-person workshops
      (25-person session cap) for women returning to the workforce,
      under an NZ Ministry of Social
      Development-funded programme: AI & the Future of Work (25 Mar), #IAmRemarkable
      + Vibe Coding (7 Apr), Cybersecurity (5 May, invitation-only), and Personal
      Branding (2 Jun) — paired with 10 self-paced AI tutorials and a job-search
      library. Chan was a named panelist in the March session and a speaker in
      April, sharing the room with RCSA recruiters from Potentia, Randstad Digital
      and Elevate Consulting who ran the networking half, and Dr Mahsa McCauley
      facilitating. Registrations across the four sessions: 39 / 32 / 5 / — , with
      27 and 24 checked in for the first two. Programme curriculum and cohort
      record: `meta.x_brand.teachingCohorts` (`her-waka-2026`).

