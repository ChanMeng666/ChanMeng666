# =============================================================================
# EVENTS — offline / in-person activities: talks, panels, hackathons mentored,
# workshops taught, community appearances.
# =============================================================================
# Shard of Chan Meng's profile data. Top-level key: events.
# All data/profile/*.yaml shards are merged (in filename order) by
# scripts/lib/load-profile.mjs and validated against schema/profile.schema.json.
# After editing: npm run check. Data map + field template: CLAUDE.md /
# docs/CONTRIBUTING-DATA.md.
#
# Purpose: a running log of braggable offline appearances so that at year-end an
# AI reading this database can generate summaries and personal-brand copy, and so
# every public-facing surface can cite where Chan showed up. Entries CROSS-REFER
# awards[]/work[]/projects[] (relatedAwardTitle / relatedWorkId / relatedProjectId)
# rather than duplicating their prose.
#
# Field template (see docs/CONTRIBUTING-DATA.md "Adding an event"):
#   id, name, role (Speaker|Panelist|Mentor|Judge|Instructor|Organizer|Attendee|MC),
#   type (talk|panel|hackathon|workshop|conference|community|award|media),
#   date ("YYYY-MM-DD"), endDate (optional), location, organizer, url,
#   keywords[], photos[] ({src, alt, caption}), summary (| block), tier, recency,
#   lastUpdated, optional relatedAwardTitle / relatedWorkId / relatedProjectId.
#
# PHOTOS. `photos[].src` points at /public/photos/events/, named
# YYYY-MM-DD-<event-slug>-<what>.jpg. scripts/audit-assets.mjs HARD-FAILS (exit 1)
# if a referenced file is absent, so place the file before writing the reference.
# Recipe + naming rules: docs/CONTRIBUTING-DATA.md "Event photos & evidence
# screenshots".
#
# SOURCE OF TRUTH for every She Sharp date, venue, roster and attendance figure
# below: the She Sharp site's own event data —
#   D:\github_repository\she-sharp\lib\data\json\shesharp_events_v3.json  (historical)
#   D:\github_repository\she-sharp\lib\data\json\events-custom.json       (2026)
# merged by lib/data/events.ts. Reconciled 2026-08-25, and every 2026 entry
# re-checked against it on 2026-09-04 (date, venue, organiser chain, url slug
# and the registered/attended line). Entries whose facts came back unchanged and
# so were NOT touched: she-sharp-academyex-iwd-2026 (103/72),
# she-sharp-own-your-energy-2026 (81/60), she-sharp-myob-working-smarter-2026
# (87/51), her-waka-2026-05-cybersecurity (33/29),
# her-waka-2026-06-personal-branding (24/16), peyvand-academy-makey-makey-2026
# (24) — their `lastUpdated` is deliberately left at the earlier date rather
# than bulk-bumped. Every `url` slug below was checked against that data — a
# slug that is not in it 404s on the live site.
# =============================================================================
