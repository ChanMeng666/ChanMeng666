# =============================================================================
# FILM DISTRIBUTION PLAN — where each finished film is published, and when
# =============================================================================
# HAND-EDITED. This is the only file in distribution/ a person or Claude edits.
# `npm run build:distribution` reads it with the filmography
# (data/profile/46-films.yaml) and the platform registers (youtube/, x/,
# linkedin/) and writes status.yaml (film x platform matrix) and calendar.md.
# How to run the calendar with Chan: distribution/README.md.
#
# What lives where:
#   - WHICH films exist, their YouTube ids and whether the site shows them:
#     46-films.yaml. Never repeat those facts here.
#   - WHICH platforms a film is meant for: `policy` below (by kind of film),
#     with per-film exceptions in `overrides`.
#   - A social post that already carries a film: `posted` below, one row per
#     post, pointing at the post's id in the X or LinkedIn register. Dates and
#     counts are read from the register, not typed here.
#   - A post still to make: `schedule` below.
#
# This repo is public. Draft post text is NOT kept in a tracked file: it lives
# in the private chanmeng-marketing repo until Chan has posted it, after which
# the X or LinkedIn register holds the published text. The video files staged
# for upload live in the gitignored distribution/_staging/.
# =============================================================================

schemaVersion: 1
asOf: "2026-10-12"

platforms:
  youtube:       { name: YouTube, account: "@ChanMeng666", register: youtube/videos.yaml }
  youtube-short: { name: YouTube Shorts, account: "@ChanMeng666", register: youtube/videos.yaml }
  site:          { name: chanmeng.org/films, register: data/profile/46-films.yaml }
  linkedin:      { name: LinkedIn (personal), account: linkedin.com/in/chanmeng666, register: linkedin/posts.yaml }
  x:             { name: X, account: "@chanmeng666", register: x/posts.yaml }
  linkedin-page: { name: LinkedIn (ArchCanvas page), account: linkedin.com/company/archcanvas, register: linkedin/company/archcanvas/posts.yaml }

# Platform facts the schedule depends on. Re-check before relying on one.
constraints:
  x: { maxVideoSeconds: 140, maxChars: 280, urlChars: 23, editable: false, note: "No Premium on the account: a film longer than 140 s goes up as a YouTube link" }
  linkedin: { linkPlacement: first-comment, note: "Upload the video natively; put links in the first comment" }

# Which platforms a kind of film is meant for. First matching rule wins.
# `reason` is shown wherever a platform is not targeted.
policy:
  - id: not-shown
    match: { notShown: true }
    targets: []
    reason: "Recorded, shown nowhere (docs/STATE.md): the project is not public, or the film was not made as a promo"
  - id: music-video
    match: { kind: music-video }
    targets: [youtube, site]
    reason: "Music videos are shown on YouTube and chanmeng.org/films only (Chan, 2026-10-09; confirmed 2026-10-12)"
  - id: explainer
    match: { kind: explainer }
    targets: [youtube, site]
    reason: "The Liu Zhongjing explainer films (watercolour and maps) are shown on chanmeng.org/films and YouTube (Chan uploaded all 25, 2026-10-17)"
  - id: earlier-version
    match: { kind: product-film, primary: false }
    targets: [site]
    reason: "One film on show per product; earlier and alternative versions are on chanmeng.org/films only"
  - id: product-film
    match: { kind: product-film, primary: true }
    targets: [youtube, youtube-short, site, linkedin, x]
  - id: brand-film
    match: { kind: brand-film }
    targets: [youtube, site, linkedin, x]
  - id: event-promo
    match: { kind: event-promo }
    targets: [youtube, site, linkedin, x]

# Per-film exceptions to the policy.
overrides:
  - film: archcanvas-studio-film
    add: [linkedin-page]
    owner: archcanvas-growth
    note: "ArchCanvas and ArchLang posts are scheduled in the private archcanvas-growth repo (marketing/content/calendar.md), not here"
  - film: archlang-film
    owner: archcanvas-growth
    note: "Scheduled with the ArchCanvas and ArchLang content, not here"
  - film: archlang-film
    remove: [youtube-short]
    note: "One cut, 16:9: no Short"
  - film: archlang-one-take-film
    remove: [youtube-short]
    note: "One cut, 16:9: no Short"
  - film: a11y-loop-launch-film
    remove: [youtube-short]
    note: "One cut, 64 s, 16:9: no Short. The a11y-loop film on show since 2026-10-20 (Chan); the 2:59 narrated film is now its earlier version, on /films"

