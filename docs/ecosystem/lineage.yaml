# Repo lineage catalog - topology only (NOT career copy; not loaded by load-profile).
# Human + agent entry point: docs/ecosystem/README.md. Validate: npm run check:ecosystem [-- --live].
# Private repos are described only in docs/ecosystem/lineage.private.yaml (gitignored, local-only).
# Endpoint forms in relations: owner/name (a repo in this catalog), external:owner/name or external:<label>,
# url:https://..., entity:<id>, asset:<id> (see nonGitAssets). A relation "from" is always a repo.
schemaVersion: 1
lastVerified: "2026-10-06"
localRoot: "D:/github_repository"
scope:
  personalAccount: ChanMeng666
  orgRepoAllowlist:
    # Every other repo in these orgs was NOT built or led by Chan - never attribute it to her.
    - gavigo-inc/gavigo-ire
    - gavigo-inc/gavigo-website
    - NZ-SheSharp/she-sharp
    - NZ-SheSharp/she-sharp-promo-video-event-lesmills-03-september-2026
    - NZ-SheSharp/she-sharp-reports
    - Chow-Luck-Club/eatropolis-website
    - Whiri-AI/tam-ai-ti-web
    - archcanvas/archcanvas
    - archcanvas/.github
    # Not an org: a client's personal account. Chan is the lead developer (paid commission).
    - NgaBlanchard/nzifocus-contact
  # Rule (Chan, 2026-10-06): holding admin access to an org does NOT make its repos hers.
  # Only repos she led are listed; e.g. Chow-Luck-Club/eatropolis-capacity is not her work.
  # A row with `accessRevoked` is still hers by authorship: access ended with the engagement
  # (the live check skips it; the local clone under localFolder is the remaining copy).
# Per-repo judgement fields (Chan agreed 2026-10-06; optional, filled as she reviews each repo):
#   positioning: her one-line statement of what the repo is FOR
#   stage:       building | maintained | paused | done | handed-over
#   showcase:    flagship | featured | listed | hidden   (how prominently it is shown publicly)
# For a repo with a catalogId the career shard stays the authority on tier: showcase flagship
# requires tier flagship there (check-ecosystem enforces it). Which promo film each product
# shows publicly is NOT here: see `productFilms` in data/profile/45-showcase.yaml.
relationTypes:
  depends-on: "code/package dependency (from consumes to)"
  powers: "from is the engine/runtime of to"
  extends: "from extends/builds on to"
  companion-of: "sibling product repos meant to be used together"
  successor-of: "from (newer generation) replaces to"
  rewrite-of: "from is a rewrite of to"
  backup-of: "from is a backup copy of to"
  snapshot-of: "from is a point-in-time snapshot of to"
  fork-of: "from is a fork of to (upstream may be external:owner/name)"
  derived-from-template: "from was generated or generalised from to"
  same-codebase-as: "private/public split of one codebase"
  mirror-of: "from and to share history (copy or fork); to may be an external:owner/name copy"
  renamed-from: "from was previously named to (old name redirects)"
  promotes: "promo film / marketing asset for to"
  markets: "growth / go-to-market workspace for to"
  documents: "paper, docs or report for to"
  showcases: "demo or examples of to"
  studies: "crawl/study copy of an external site or app"
  data-for: "export/archive that feeds to"
  deployed-as: "from is deployed at url:... (live domain)"
  built-for: "from was built for an entity (entity:<id>), only where not obvious from the family"
  listing-submission-for: "from is Chan's fork of someone else's awesome-list, kept only to submit `to` (her own project) for listing; the fork itself is NOT her project (ownProject: false)"
  forked-by: "to (external:owner/name) is a fork of from, continued by someone else (handover); from stays the original build"
  shares-scaffold-with: "repos that start from the same boilerplate (byte-identical app/scaffold files) with no shared commits; direction unknown; shadcn/ui, Create Next App and community-health files do not count"
