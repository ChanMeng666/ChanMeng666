<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="collage.css">
<style>
  .pages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; align-items: start; }
  .pages .shot { aspect-ratio: 724 / 1024; object-fit: cover; }
</style>
</head>
<body>
<div class="plate">
  <header>
    <div>
      <div class="kicker">Typeset PDF report · She Sharp</div>
      <h1>2026 Half-Year Report</h1>
    </div>
    <div class="chips">
      <span class="chip o">31 pages</span>
      <span class="chip">Typst + CeTZ</span>
      <span class="chip v">every figure source-traced</span>
    </div>
  </header>
  <div class="pages">
    <figure><img class="shot" src="../src/pdf-report/she-sharp-h1-p01.jpg"><figcaption class="caption">p.1 · cover</figcaption></figure>
    <figure><img class="shot" src="../src/pdf-report/she-sharp-h1-p05.jpg"><figcaption class="caption">p.5 · at a glance</figcaption></figure>
    <figure><img class="shot" src="../src/pdf-report/she-sharp-h1-p10.jpg"><figcaption class="caption">p.10 · cohort page</figcaption></figure>
    <figure><img class="shot" src="../src/pdf-report/she-sharp-h1-p20.jpg"><figcaption class="caption">p.20 · member platform</figcaption></figure>
    <figure><img class="shot" src="../src/pdf-report/she-sharp-h1-p16.jpg"><figcaption class="caption">p.16 · chapter opener</figcaption></figure>
  </div>
  <footer><span>Built from the charity's event register, member database and booking exports</span><b>chanmeng.org/work</b></footer>
</div>
</body>
</html>
