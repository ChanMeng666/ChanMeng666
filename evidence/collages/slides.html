<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="collage.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid .shot { aspect-ratio: 16 / 9; object-fit: cover; }
</style>
</head>
<body>
<div class="plate">
  <header>
    <div>
      <div class="kicker">Event slides · She Sharp</div>
      <h1>Aotearoa AI Hackathon Festival 2026</h1>
    </div>
    <div class="chips">
      <span class="chip o">91 slides</span>
      <span class="chip">2 days · 12 teams</span>
      <span class="chip v">live in the browser</span>
    </div>
  </header>
  <div class="grid">
    <img class="shot" src="../src/slides/hackathon-01-cover.jpg">
    <img class="shot" src="../src/slides/hackathon-19-challenges.jpg">
    <img class="shot" src="../src/slides/hackathon-28-team-forming.jpg">
    <img class="shot" src="../src/slides/hackathon-86-winners.jpg">
  </div>
  <footer><span>AUT City Campus · 7–8 August 2026 · shesharp.org.nz/present</span><b>chanmeng.org/work</b></footer>
</div>
</body>
</html>
