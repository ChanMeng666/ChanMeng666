# How the account stands as a publishing surface: its reach, how it has been
# run, and what was noticed at the last capture. Hand-maintained: update it
# after every capture. `npm run build:linkedin-register` compares the
# `account:` block with linkedin/capture/latest.json and fails when they
# disagree, so this file cannot quietly go stale.
#
# This file does not repeat the profile copy. The headline, About, Experience
# and the other sections are in data/profile/70-linkedin.yaml (generated views:
# linkedin/linkedin-*.md). Every post is in linkedin/posts.yaml.
#
# `followers` is recorded at its historical maximum and never lowered.
#
# This repo is public. Nothing private belongs here: no messages, no drafts, no
# analytics, no connection list. Impressions are in the gitignored
# linkedin/posts.private.yaml.
# =============================================================================

