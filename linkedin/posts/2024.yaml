    text: |-
      🌟 Exciting News! Today, I received my acceptance email from "She Can" (她行) as an official Mentor for their Winter 2024 project! 🌟

      💌 Acceptance Email Highlights:
      The "She Can" program connects women across generations through mentorship, with experienced professionals supporting younger women in STEM as they navigate early career challenges. I’ll be meeting with mentees weekly and sharing insights on professional growth, while also learning from their fresh perspectives. My volunteer liaison, Yijia Li, will help with all coordination—looking forward to working closely with her and the mentees!

      👩 About "She Can"
      Established in 2020, "She Can" is a nonprofit that empowers women in STEM through one-on-one or small group mentorship. With over 1,000 members, they aim to promote gender equality in technology and science through hands-on support and community. Recently, they even launched a podcast, "Her Voice," amplifying women's experiences and stories across industries.

      📌 As a Mentor, I hope to:
