      🌟 From Clutter to Clarity: My Minimalist Journey 🌟

      I'm excited to share my transformation from a typical consumer to a devoted minimalist, all while navigating the IT world! 🚀

      🏠 2018: Bid farewell to the family nest and jumped into my own cosy haven. But hey, after a shopping spree, minimalism caught my eye. Two months in, and I was hooked!

      📚 2019: Dived deep into the minimalist philosophy with books and films galore. Education is key.

      🛫 2020: New city, new job, one suitcase. That’s all I needed. Started living in a barely furnished room—minimalism to the max!

      💡 2021: Not just stuff, but also shedding societal expectations and stereotypes. Life got lighter in every sense!

      📝 2022: Big changes this year—new surname, goodbye old traditions, and yes, I’ve pledged to donate my organs. Let’s leave a mark, not clutter!

      ✈️ 2023: From China to the Philippines with just a backpack, then to New Zealand to dive into Computer Science with the same minimalist vibe.

      🖥️ 2024: Now, I’m all about blending minimalist aesthetics with web and app design. Simplify to amplify.

      Embracing minimalism has not only transformed my spaces but also my professional ethos. Efficiency, focus, and simplicity drive my tech pursuits. Let’s connect and simplify the digital world together! 🌐

      #MinimalismInTech #DigitalNomad #SimplifyToAmplify
