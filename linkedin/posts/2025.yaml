      🌟 2025 Reflection: Building Tech, Connecting People

      As 2025 comes to a close, I’ve been reflecting on my journey since joining She Sharp in July. What started as a role for an AI Specialist & Full-Stack Developer quickly became a mission to build something meaningful for our community of 2,200+ women in STEM.

      💻 From Lines of Code to Real Impact
      Over the past six months, I’ve poured my heart into architecting the new She Sharp platform from scratch.
      My goal was to make mentorship accessible and intelligent. I built a custom AI matching engine (powered by GPT-4o) that looks beyond just keywords—it understands personality, goals, and skills to find the perfect mentor-mentee fit.
      Under the hood, it’s a robust full-stack solution built with Next.js 15, PostgreSQL, and robust security protocols. But what matters most isn't the code itself; it's that starting January 2026, this platform will help thousands of women connect, learn, and grow together.

      🤝 Mentorship & Connection
      Beyond the development work, the true highlight was connecting with you all in person.
      A special memory for me was serving as a Mentor at the She# AI Hackathon. It was incredibly rewarding to support so many talented participants, helping guide your ideas and watching you turn them into reality. The energy at that event—and at our visits to Fonterra, Xero, and Vector—was truly inspiring.

      I’ve collected our memories from the year below. If we met, try to find yourself in the photos! 👇

      📸 She# TechBabesNZ
      🔗 https://lnkd.in/eePyaiBM
      📸 She# AI Hackathon AI Forum NZ & Auckland University of Technology 2025
      🔗 https://lnkd.in/eHka5q7Z
      📸 She# Fonterra
      🔗 https://lnkd.in/egcgKV_a
      📸 She# Xero with Secure Code Warriors
      🔗 https://lnkd.in/e-EUPcKw
      📸 She# Vector Limited
      🔗 https://lnkd.in/eXXmAYaS

      💜 Thank You
      To the She Sharp team and everyone I’ve met this year: thank you for welcoming me and inspiring me. I’m incredibly excited to launch what we’ve built next month!

      Here’s to a smarter, more connected 2026. 🚀

      Dr Mahsa McCauley (Mohaghegh) Michael McCauley Prasanth Pavithran (MBA) Meeta Patel Sabrina Teoh Raquel Anne Maderazo Marriane Bentigan Moksha Shah Sara Ghafoor @Archita Nair Nikita Kumari, PMP® Len Estioko Gurleen Kaur Alyssa Pausanos Yesha Kaniyawala Isha Sangrolkar Lesley Gao

