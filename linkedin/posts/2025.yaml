      🎉 Excited to announce my latest open-source project: Google News MCP Server!

      🔍 This Model Context Protocol (MCP) server implementation enables seamless Google News search capabilities with automatic categorization and multi-language support via SerpAPI integration.

      Key achievements:
      ✨ Listed on Glama.ai with AAA rating and security verification
      ✨ Available on Smithery.ai
      ✨ Integrated with mcp-get
      ✨ Published as an npm package

      🛠️ Easy installation options:
      • Via Smithery: `npx -y @smithery/cli install @chanmeng666/google-news-server --client claude`
      • Via mcp-get: `npx @michaellatman/mcp-get@latest install @chanmeng666/google-news-server`
      • Via npm: `npm install @chanmeng666/google-news-server`

      🔓 MIT Licensed | 🔒 Security Verified | 📦 Version 1.0.0

