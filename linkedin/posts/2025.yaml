      Had an incredible time at the inaugural Claude Code Meetup Auckland last night! 🇳🇿✨

      A huge thank you to Adam Holt and @thecolab.ai for bringing the local builder community together at the 2degrees office. The energy was high, and it’s clear that agentic workflows are reshaping how we develop software. I really enjoyed the insightful conversations with fellow developers Rivindu Weerasekera, Hunter Reid, and Nicholas Kondal. 😘

      To contribute back to this growing community, I wanted to share an open-source tool I’ve been developing to make the Claude Code experience even smoother:

      🔊 Claude Code Audio Hooks
      We all know the struggle of staring at the terminal waiting for a long task to finish or missing an authorization prompt. I built this tool to add intelligent audio notifications to the CLI. Now, you can multitask freely and get a pleasant alert when:
      ✅ Claude finishes a task
      ⚠️ Claude needs your permission (Human-in-the-loop)
      🤖 A sub-agent completes a background job

      It’s fully compatible with macOS, Windows (WSL), and Linux.

      Check it out on GitHub and let me know what you think! 👇
      🐱🔗 https://lnkd.in/gSnsPGrT

