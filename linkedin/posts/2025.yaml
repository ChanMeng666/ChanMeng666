      • 📊 Period Calendar with comprehensive tracking for cycles, symptoms & wellness
      • 📚 Resource Library with categorized health materials
      • 🗓️ Health Events Calendar for workshop registration
      • 📝 Anonymous feedback submission system
      • 🤖 "Sani Assistant" - AI chatbot offering personalized health guidance

      👩‍💻 𝗛𝗥 𝗧𝗲𝗮𝗺 𝗧𝗼𝗼𝗹𝘀:
      • 📋 Resource management dashboard
      • 📅 Event scheduling interface
      • 📈 Feedback analysis tools
      • 🧠 Specialized AI support for policy guidance

      All with dark/light mode toggle, "Remember Me" authentication, and fully responsive design! 💫

      𝒜 𝒮𝓅𝑒𝒸𝒾𝒶𝓁 𝒯𝒽𝒶𝓃𝓀 𝒴𝑜𝓊:

