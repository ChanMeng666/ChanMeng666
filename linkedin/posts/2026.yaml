    text: |-
      🧠 In the AI era, your knowledge base is only as useful as your AI can read it 📂

      Most people still choose a notes app for the UI. In 2026, that's the wrong question.

      The real one: can an agent read your entire second brain — without an export, an API, or a permission slip? If your knowledge lives in a proprietary database, the answer is no. You've quietly walled off your single best asset from the most powerful tools you'll ever have.

      Here's the stack I run on, and why 👇

      📂 1/ Obsidian is the knowledge base — not a "notes app"
      Your vault is just a folder of Markdown files on your own disk. That's the feature, not the limitation.
      → Local-first: you own it, offline, forever
      → Any model can read it — local via Ollama, cloud APIs, or MCP-connected agents like Claude Code
      → Bidirectional links turn notes into a graph, not a pile

      ✍️ 2/ Markdown is the source of truth + content management
      Plain text is the AI-native format.
      → Token-efficient: a Markdown doc is 3–5× lighter than the same PDF
      → Structurally legible to an LLM: an H1 (#) literally tells the model "new section starts here"
      → Future-proof: openable in any editor decades from now — zero vendor lock-in

      🖥️ 3/ HTML is the presentation layer
      Markdown is where you think; HTML is where you ship.
      → One source → many surfaces: blog, slides, docs, landing pages
      → Render on demand, keep the source clean
      → Separation of content and presentation — the oldest good idea in software, finally effortless

      The mental shift:
      🗄️ Old world → knowledge trapped in a proprietary app, exported only when the tool allows
      🧠 New world → knowledge as plain text your agents read end-to-end, presented as HTML on demand

      Your second brain shouldn't need an API to talk to your AI. Make it plain text. ✨

      How are you structuring your knowledge for the AI era — a plain-text vault, or still inside a walled database? Curious where you land 👇

