    text: |-
      Alexandra Belyanina shared her notes from our Shanghai conference — here's what I keep coming back to.

      Women's health isn't short on data. It's short on data that fits together.
      Shanghai, Copenhagen, Boston all hold real numbers. Different definitions, different rules, formats that don't talk. So every AI model here learns from one thin slice of the world — and we call it "not enough evidence."

      Then the trap: thin data looks like thin demand, so no one funds the research that would create the data.

      Money alone won't break that loop. Connecting the pieces will.
      That's the work at FemTech Weekend. 🌏

      #FemTech #WomensHealth #FemTechWeekend #HealthData #AIinHealthcare #EastMeetsWest #WomenInTech
