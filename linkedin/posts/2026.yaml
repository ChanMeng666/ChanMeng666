      Yesterday, I had the privilege of serving as a Panel Speaker at the HER WAKA programme "AI & The Future of Work" session in Auckland. Hosted by She Sharp and supported by the Ministry of Social Development (MSD), we dove deep into how AI is transforming jobs and creating new pathways. 🇳🇿✨

