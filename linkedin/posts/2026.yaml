    text: |-
      You leave the Claude Code window. It finishes, asks for permission, or hits a rate limit. You find out when you come back. 🔔

      I built echook so that moment makes a sound.

      39 events, and 47 specific cases inside them. Each one has its own sound. Three are on by default: a turn ended, a permission request, and a notification. The rest stay quiet until you turn them on.

      You set it up by talking to your agent.
      → "Mute it for an hour."
      → "Switch to chimes."
      No settings file to edit. One command-line tool, and the agent runs it.

      It also runs on Cursor and Codex. A desktop toast, a short spoken summary, or a webhook to your phone. Sound stays on your machine. The webhook stays off until you give it a URL.

      Today I submitted v6.7.2 to Anthropic's Claude Code plugin directory. The security scan passed. The listing is in content review.

