    text: |-
      🙏 A day and a half, a night in between, 12 pitches, 72+ participants. I mentored at the Aotearoa AI Hackathon Festival 2026 — and the part I keep thinking about isn't the pitches.

      It's that people let me see their code before it worked.

      Handing a half-built repo to someone you met an hour ago, with the clock running — that's trust, and it isn't the default in this industry. Thank you to every team that said "can you look at this, it's broken." 🫶

      What I didn't expect was what came after judging closed.

      6 participants have since found me — LinkedIn, email, even Discord — asking the things a weekend was too short for. How do I turn a demo into something real? What should I let AI write, and what should I never delegate? Where does a career in AI engineering actually start?

      Keep asking. But let me make it easier than a DM 👇

      I run a free, open-source teaching platform at programming.chanmeng.org

      📚 Five cohorts online side by side — 2024 Winter through the 2026 TechNest, Her Waka and Peyvand tracks. Your material doesn't vanish when the next class starts.
      🤖 An AI tutor that answers from YOUR cohort's lessons, not generic chatbot output — retrieval over ~4,800 indexed chunks of the real curriculum.
      🚀 A public Demo Day of what students shipped — CreditHero, iCare, JobOrg-AI.

      100+ learners since 2024. Source on GitHub. Not going anywhere.

      Ngā mihi to She Sharp, Auckland University of Technology and AI Forum New Zealand for running it. ❤️

