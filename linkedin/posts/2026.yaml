      🤝 Friday | Give To Gain
      The weekend kicked off with the She Sharp & academyEX IWD event. Instead of just attending, I loved rolling up my sleeves and volunteering behind the scenes—helping set up the space, welcoming guests, and ensuring everything ran smoothly. Seeing so many people come together for honest conversations about gender equality in tech was truly inspiring. It was a beautiful reminder of what we can achieve when we show up to support one another.

      🏃‍♀️ Sunday | Hitting the Pavement
      The momentum carried right into Sunday morning! I traded my ambassador hat for running shoes to tackle the 8.4km Southern Cross Round the Bays Auckland. A massive thank you to Dr Mahsa McCauley (Mohaghegh) and Michael McCauley for inviting me to join them and their wonderful daughter for the run. Crossing that finish line⏱️ along the beautiful Tāmaki Drive was the perfect way to celebrate.

      💡 Whether it’s coordinating logistics for a community event, building tech solutions, or pacing through an 8.4km run, the core lesson is always the same: progress is a team sport. To all the brilliant women out there—keep taking up space, keep supporting each other, and let’s keep moving forward together. 💪✨

