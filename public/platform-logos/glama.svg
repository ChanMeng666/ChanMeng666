<!--
  Source of truth for every raster icon; run `pnpm run generate:favicons` after editing.

  The 45-unit inset is a safe area, not styling. Google Search draws the favicon inset inside a
  white circular chip, so any part of the white llama that reaches the canvas edge fuses with that
  chip and the silhouette dissolves – which is exactly what the pre-2026-08 art did with only 15
  units of vertical clearance. Keep at least ~14% clear on every side.

  `shape-rendering="crispEdges"` is deliberately absent. It snaps edges to whole device pixels, and
  at a 16px render each 10-unit block is 0.38px, so the ears collapse and the rounded corners
  square off entirely.
-->
