    posts:
      - id: "2080283210576245002"
        at: "2026-07-23T13:25:41.000Z"
        text: |-
          Suno's real discovery isn't the /trending endpoint everyone links — that's been frozen since Sept 2024.

          The curated editorial shelves are what actually move. So I snapshot them daily and turned it into a free chart:

          https://seismophone.chanmeng.org/charts
        links:
          - https://seismophone.chanmeng.org/charts
        metrics: { views: 24, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080283214942511464"
        at: "2026-07-23T13:25:42.000Z"
        text: |-
          Then I ran a census: the frozen 2024 trending fossil vs today's live Staff Picks shelf.

          Same platform, ~2 years apart. What changed in what the machine puts in front of people?
        metrics: { views: 11, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080283217559777525"
        at: "2026-07-23T13:25:43.000Z"
        text: "Model mix. 2024 fossil: basically all v3-era (78% v3.5, the rest v3). Live Staff Picks: v5.5 alone is the single biggest at 45.5%, v4.5-family 31.8%. The v3 generation that was 100% of the fossil is now 0%."
        metrics: { views: 1, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080283221200380354"
        at: "2026-07-23T13:25:44.000Z"
        text: "Creation method moved too. Fossil: 70.7% concats/extensions, 29.3% fresh generations. Live shelf: 86.4% fresh generations, concats down to 4.5%. The old chart is stitched-together extends; the curated shelf is prompt-to-song."
        metrics: { views: 0, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080283223847026950"
        at: "2026-07-23T13:25:45.000Z"
        text: "Why this is even measurable: Suno publishes the model badge and creation-method flags on its own public song objects. No login, no scraping. These are the same anonymous endpoints your browser hits when it loads a song page."
        metrics: { views: 5, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080283227261141028"
        at: "2026-07-23T13:25:45.000Z"
        text: "Caveat I won't bury: this is the curated shelf, not all of Suno. It's what editors surface, not what the crowd streams. And the trending endpoint is a fossil: a real 200 OK serving a dead 2024 payload. I never treat it as live."
        metrics: { views: 11, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2080284150716838252"
        at: "2026-07-23T13:29:25.000Z"
        text: "One more: Suno curates a shelf literally named \"Best of v5.5\". It's 100% v5.5 by construction: the platform merchandises its newest model as its own shelf. Full method + numbers: https://seismophone.chanmeng.org/observatory/the-model-census and watch the shelf move, free: https://seismophone.chanmeng.org/charts"
        links:
