  - id: "2109881681016701149"
    url: https://x.com/chanmeng666/status/2109881681016701149
    kind: thread
    posted: "2026-10-13"
    topic: technical-deep-dive
    pillar: P1
    summary: "Code is the cache of the agent: agents work a job out, code keeps the path once it repeats, infrastructure stays and applications become disposable (five posts, one image)."
    totals: { posts: 5, rootViews: 112, views: 148, likes: 2, replies: 5, reposts: 0, quotes: 0, bookmarks: 0 }
    posts:
      - id: "2109881681016701149"
        at: "2026-10-13T05:39:27.000Z"
        text: |-
          Code is the cache of the agent.

          An agent works out how to do something. If the same job keeps coming back, the path that worked gets written down: fixed, testable, cheap to run.

          The agent figures it out once. The code remembers.
        media:
          - type: photo
            size: 808x1174
            alt: null
            src: https://pbs.twimg.com/media/HUfOL8kbYAAx2ek.jpg
        metrics: { views: 112, likes: 2, replies: 2, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2109881683663282232"
        at: "2026-10-13T05:39:27.000Z"
        text: |-
          A lot of applications won't be worth keeping.

          Ask which customers are about to churn, and an agent can query the data, draw the view and file the follow-up tasks. That dashboard lives for thirty seconds. Nobody maintains it.
        metrics: { views: 18, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2109881685806596473"
        at: "2026-10-13T05:39:28.000Z"
        text: |-
          What stays is what an agent can't improvise on the spot: databases, networks, identity, payments, schedulers like Kubernetes.

          They have to exist before the agent starts, and be the same tomorrow.
        metrics: { views: 6, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2109881688071541031"
        at: "2026-10-13T05:39:28.000Z"
        text: |-
          My first version of this said only infrastructure survives. Too strong.

          Code that agents keep reusing survives too. It just stops being where the thinking happens.
        metrics: { views: 6, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2109881690315440472"
        at: "2026-10-13T05:39:29.000Z"
        text: |-
          Infrastructure stays.
          Applications become disposable.
          Code is where a solution goes once it's worth keeping.
        metrics: { views: 6, likes: 0, replies: 0, reposts: 0, quotes: 0, bookmarks: 0 }
