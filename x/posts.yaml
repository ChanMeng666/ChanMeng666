    summary: "ArchLang launch thread: floor plans as text that compiles, why a compiler can check what a picture cannot, an honest status line, the playground, and ArchCanvas as what is built on top."
    totals: { posts: 7, rootViews: 37, views: 121, likes: 0, replies: 6, reposts: 0, quotes: 0, bookmarks: 0 }
    posts:
      - id: "2077651235411554599"
        at: "2026-07-16T07:07:10.000Z"
        text: |-
          Floor plans are pictures. And pictures can lie.

          A wall that doesn't quite close. A door too narrow to actually walk through. Room sizes that don't add up to the total. You can't see any of it by looking.

          So I built a compiler for floor plans.
        metrics: { views: 37, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2077651238645371124"
        at: "2026-07-16T07:07:10.000Z"
        text: |-
          It's called ArchLang. You describe a plan as text — rooms, walls, doors, windows — and it compiles to SVG, DXF, and PDF.

          Same idea as source code: if the geometry is broken, it doesn't quietly look wrong. It fails to compile, and tells you where.
        metrics: { views: 23, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2077651241048699075"
        at: "2026-07-16T07:07:11.000Z"
        text: |-
          Why compile instead of draw?

          Because a picture can't be checked and text can. The compiler knows whether a door is at least 700mm or isn't. Whether every room has a way in. Whether the room areas actually sum to the floor area.

          A JPEG knows none of that.
        metrics: { views: 5, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2077651245008056602"
        at: "2026-07-16T07:07:12.000Z"
        text: Here's a plan and the compiler's read of it — real door widths, windows per room edge, reachability, and whether the arithmetic closes. Not "looks like a house." Facts you can verify.
