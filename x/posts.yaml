    summary: "Follow-up to a floor-plan detection developer: how ArchLang models rooms, walls and doors, and which sample it would need to test an import."
    totals: { posts: 1, rootViews: 9, views: 9, likes: 1, replies: 0, reposts: 0, quotes: 0, bookmarks: 0 }
    posts:
      - id: "2115626525840252954"
        at: "2026-10-29T02:07:24.000Z"
        text: In ArchLang a room is a box at (x,y) in mm, walls are polylines with a thickness, and doors sit on walls. `arch takeoff` exports wall lengths as CSV and `arch describe --json` gives each room's net area. A JSON of walls and rooms from one detected plan is the sample I'd need.
