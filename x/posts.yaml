  - id: "2092400754896388447"
    url: https://x.com/chanmeng666/status/2092400754896388447
    kind: thread
    posted: "2026-08-26"
    topic: technical-deep-dive
    projectIds:
      - archlang
      - archlang-showcase
    pillar: P4
    summary: "The Oval Office drawn in ArchLang: one arc clause in a wall, how cw and ccw decide which way it bows, windows placed by arc length, the measured area, and a plain note that it is an illustration and not a survey."
    totals: { posts: 6, rootViews: 32, views: 75, likes: 0, replies: 5, reposts: 0, quotes: 0, bookmarks: 0 }
    posts:
      - id: "2092400754896388447"
        at: "2026-08-25T23:56:29.000Z"
        text: |-
          The most famous office in the world is an oval.

          Draw-by-code tools mostly give you a rectangle with an apologetic label on it. This one is a real arc — one clause inside the wall:

          wall id=w_oval exterior thickness 300 { (47000,31000) arc (36000,31000) radius 7300 cw }
        media:
          - type: photo
            size: 1600x900
            alt: null
            src: https://pbs.twimg.com/media/HQmzLtlaoAADLSw.jpg
          - type: photo
            size: 1600x1441
            alt: null
            src: https://pbs.twimg.com/media/HQmzPIHaQAAvsHU.jpg
          - type: photo
            size: 1600x1130
            alt: null
            src: https://pbs.twimg.com/media/HQmzQKIawAAnSQ7.jpg
        metrics: { views: 32, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2092400758360789190"
        at: "2026-08-25T23:56:30.000Z"
        text: "The wall contributes exactly two arc commands to the SVG: A 7450 and A 7150 — the outer and inner face of the same wall, at R plus and minus half its 300 mm thickness. Native arcs in SVG and DXF alike: the bow never facets, at any zoom."
        media:
          - type: photo
            size: 1600x1441
            alt: null
            src: https://pbs.twimg.com/media/HQmzTtYagAAoI9a.jpg
        metrics: { views: 24, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2092400761674371290"
        at: "2026-08-25T23:56:31.000Z"
        text: |-
          cw is the whole trick. The wall is walked east to west, and cw puts the circle's centre to the right of travel — inside the building — so the facade bulges out into the Rose Garden.

          Change that one word to ccw and the same two endpoints give you a room that caves inward.
        media:
          - type: photo
            size: 1600x1130
            alt: null
            src: https://pbs.twimg.com/media/HQmzW4PakAAvLIb.jpg
        metrics: { views: 9, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2092400764090245249"
        at: "2026-08-25T23:56:31.000Z"
        text: |-
          The three south windows are written window on w_oval at 25%, and a percentage on a curve walks by arc length, not by the chord.

          So they land on even quarters of the bow's 12457 mm run, with radial jambs and tangent panes, and there is no trigonometry in the source.
        metrics: { views: 4, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2092400766116147599"
        at: "2026-08-25T23:56:32.000Z"
        text: |-
          arch describe --json reports the Oval Office as 90.48 m² — shoelace over the ring you'd actually walk, not a bounding box — and drops the room's name at its true centroid.

          Whole floor: 24 rooms, 1568.98 m², A1 at 1:100. validate --strict comes back clean.
        metrics: { views: 4, likes: 0, replies: 1, reposts: 0, quotes: 0, bookmarks: 0 }
      - id: "2092400768016125981"
        at: "2026-08-25T23:56:32.000Z"
        text: |-
          Honest about what this is: an original illustration based on publicly available floor plans, not an official record. Room names and relationships are the documented ones. Every dimension is plausible rather than surveyed.

