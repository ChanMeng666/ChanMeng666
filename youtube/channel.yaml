# =============================================================================
# YouTube channel register — @ChanMeng666
# =============================================================================
# What the channel PUBLICLY shows, as read from and applied in YouTube Studio.
# Hand-maintained after each change on YouTube (there is no API sync); `asOf`
# is the date a block was last compared with Studio. Not wired into
# `npm run build`. How to read and change the channel: youtube/README.md.
#
# This repo is public. So this file lists PUBLIC videos and PUBLIC playlists
# only, plus counts for the rest. An unlisted video is reachable by anyone who
# has its id, so unlisted and private ids, titles and client playlists live in
# the local-only, gitignored `channel.private.yaml`. One unlisted id appears
# here because a profile shard already links it on purpose.
#
# Facts in titles and descriptions trace to `data/profile/`; display rules in
# `docs/STATE.md` apply here too (one film per product; GenLAB and Seismophone
# are not shown). Which film a product shows is decided in
# `data/profile/45-showcase.yaml` › productFilms, not here.
#
# Chan decided every row on 2026-10-07 (triage page). Do not change a video's
# visibility, title or playlist without asking her.
# =============================================================================

channel:
  handle: "@ChanMeng666"
  id: UCNfqqzosj2J6bBRVgz7qbJQ
  url: https://www.youtube.com/@ChanMeng666
  asOf: "2026-10-08"
  subscribers: 24          # historical maximum; never lower it
  description: |
    I'm Chan Meng, an AI agent architect and full-stack engineer based in Auckland, New Zealand.

    This channel shows what I build: product films for my own products and for client work, and demos of the tools behind them. The films are made in code, and each one is a coded replica of the product's real interface rather than a screen recording.

    Portfolio and CV: https://chanmeng.org
    Code: https://github.com/ChanMeng666
  links:
    - { title: "Portfolio & CV", url: "https://chanmeng.org" }
    - { title: LinkedIn, url: "https://www.linkedin.com/in/chanmeng666/" }
    - { title: GitHub, url: "https://github.com/ChanMeng666" }
    - { title: ArchCanvas, url: "https://archcanvas.uk/" }
  contactEmail: chanmeng.dev@gmail.com
  banner: youtube/banner/youtube-banner.png   # uploaded
  watermark: profile photo, shown at end of video
  homeTab:
    enabled: true
    trailer: QC2fqBGp4Xg   # shown to people who have not subscribed
    featuredVideo: null
    # Order as published on 2026-10-07. The three playlist rows were appended
    # after YouTube's default rows. Order suggested to Chan on 2026-10-08, hers
    # to drag in Studio: Product films, Short videos, Demos & walkthroughs,
    # Brand films, Music videos, Videos, For You; remove Created playlists.
    sections:
      - For You
      - Videos
      - Short videos
      - Created playlists
      - "Single playlist: Product films"
      - "Single playlist: Demos & walkthroughs"
      - "Single playlist: Brand films"
      - "Single playlist: Music videos"
  # Video and playlist descriptions carry NO links (Chan, 2026-10-07): the
  # account has not done YouTube's one-time verification, so a link in a
  # description cannot be published as a link. Links live in `links:` above.
  # Do not add URLs to a description until she says the verification is done.
  linksInDescriptions: false

counts:
