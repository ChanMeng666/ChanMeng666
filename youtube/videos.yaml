    tab: videos
    title: 把今天留一小块给我 · Save Me a Little of Today | Music video drawn entirely by code
    uploadedUtc: '2026-10-16'
    seconds: 196
    views: 75
    links:
      - https://suno.com/song/85d709dc-41c1-4a36-969a-1367fd9fc5bb
      - https://chanmeng.org/films#save-me-a-little-of-today
      - https://chanmeng.org
      - https://github.com/ChanMeng666
    description: |-
      《把今天留一小块给我》 Save Me a Little of Today is one of my own songs, and this is its music video. Every frame is drawn by code: Python paints the watercolour layers, a web page animates them as a pure function of time, headless Chrome captures every frame, and ffmpeg adds the song. No image or video generation model, no photograph and no footage is used for the picture.

      The film is drawn as procedural pen-and-wash watercolour: one ordinary stretch of days in an old Taipei lane.

      • A small square of today: a sticky note on the fridge, a square of sunlight crossing the kitchen floor, one lit window across the lane. On every "留一小块给我" a pen goes once round a small square, and the things left unsaid float up as blank notes.
      • Mint against grey: rain, dusk and night are grey-blue; the one fresh colour is the mint on the sill, a little taller every time we see it.
      • No face is ever drawn: backs, hands, two silhouettes in two windows, two mugs on a table.

      Thirteen painted sets and 82 layers from one small watercolour engine, in 41 shots cut to the song's own lyric timing.

      Credits
      Song: Chan Meng, made with Suno.
      Picture: treatment, painting and animation code by Chan Meng, built with Claude Code.
      Fonts are openly licensed.

      1920×1080, 24 fps.

