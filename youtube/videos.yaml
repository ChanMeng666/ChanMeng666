    description: |-
      《二月的延长线》 February, on an Extended Line is one of my own songs, and this is its music video. Every frame is drawn by code: a web page draws frame t, headless Chrome captures it, and ffmpeg adds the song. No image or video generation model and no footage is used for the picture.

      A midnight ground and two thin lines: hers in rose gold, his in champagne.

      • Each line is drawn on its own until the two meet on a metro platform as the train doors open.
      • From there they run side by side through one unbroken drawing of a single day: a garden pavilion, a riverside skyline, a truss bridge and its reflection, a steamer of dumplings, a photo kept in an album, a lamp.
      • The two lines never touch. They are parallel offsets of one path.
      • The film ends on a circle that stops just short of closing. Both lines then continue as dashed lines, which in geometry are extension lines (延长线), and run off the frame.

      This film picks up where the first one ends: 《十月的微雨》 A Drizzle in October, also on this channel: https://youtu.be/X3nUfLHawq4

