      - https://chanmeng.org
      - https://github.com/ChanMeng666
    description: |-
      a11y-loop is an open-source Agent Skill and CLI for AI coding agents. The agent decides accessibility while it plans, writes accessible UI, audits the rendered page in a real browser, fixes what it finds and audits again. Then it says plainly what it could not check.

      This film walks one full loop: install, the plan gate, writing the page, the audit gate, an audit across five rendering passes and an open dialog, the fix, the re-audit and the manual checklist. The interface is a coded replica. Every command output on screen comes from a real run of a11y-loop 0.4.1, and the browser shows the tool's own demo page.

      I'm Chan Meng, an AI agent architect and full-stack engineer in Auckland, New Zealand.

