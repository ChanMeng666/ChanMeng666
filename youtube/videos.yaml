    description: |-
      《铁皮》 Sheet Metal is one of my own songs, and this is its music video: film 7 of 8 for my album 《记忆琥珀2022》 Memory Amber 2022, a memoir of one year. Every frame is drawn by code: a web page draws frame t, headless Chrome captures it, and ffmpeg adds the song. No image or video generation model, no photograph and no footage is used for the picture.

      This film is drawn as a three-ink risograph punk zine. The album has one film per song, and each is drawn a different way.

      Three rules run through all eight films:
      • One amber light per film, and the film ends on it.
      • One white that changes meaning from film to film.
      • No faces. Every figure is a silhouette, a back or a distant shape.

      The album, film by film
