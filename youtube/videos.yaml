    title: 'a11y-loop — one full loop: plan, write, audit, fix, report | Product film'
    uploadedUtc: '2026-10-20'
    seconds: 64
    views: 82
    links:
      - https://github.com/ChanMeng666/a11y-loop
      - https://www.npmjs.com/package/a11y-loop
