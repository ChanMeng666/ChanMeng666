    description: |-
      One continuous zoom across ArchCanvas's infinite canvas, told backwards. No voiceover: text set in the canvas and one music bed carry it. Every drawing, rendering and number on screen came out of the live product. Made in code with Remotion, in four aspect ratios from one edit.

      ArchCanvas is an AI design agent for homes. You describe what you want in plain language, and it writes one floor plan in ArchLang, compiles it to a real dimensioned drawing, and renders an image grounded on that exact plan. From there you refine it by talking to it on an infinite canvas: edits change the plan in place instead of regenerating it.

      I'm Chan Meng, an AI agent architect and full-stack engineer in Auckland, New Zealand. ArchCanvas and ArchLang are my own products.

