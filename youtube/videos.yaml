    description: |-
      1842 年至今。英國金本位、兩次世界大戰、美元循環、冷戰，以及「兩頭牛打架，踩死青蛙」。

      1842 – today. The British gold standard, the world wars, the dollar cycle, the Cold War, and two bulls fighting trample a frog.

      《劉仲敬史觀 · 地圖紀錄片》系列「世界（四部）」之一，全系列共 11 部：這片土地、共和國、世界。
      Part of "Liu Zhongjing's History, in Maps", eleven animated map documentaries in three series (This Land, The Republic, The World) that retell history as Liu Zhongjing reads it.

      片中引文均逐字取自劉仲敬的著作、講座、訪談與貼文，出處標註於畫面上。
      Every quotation on screen is verbatim from his books, lectures, interviews or posts, with its source shown.

      地圖以 Natural Earth 公有領域資料為底，用今日邊界作為歷史區域的舞台，不代表任何主權主張。
      Maps are drawn from public-domain Natural Earth data. Present-day borders are used only as a stage for historical regions and imply no claim about sovereignty.

      畫面全部以程式繪製：WebGL 與 Canvas 地球儀、d3-geo 投影，無頭瀏覽器逐格渲染，配樂以真實樂器採樣演奏。未使用任何 AI 圖像或影片生成模型、照片或素材庫影片。
      Every frame is drawn in code (WebGL, Canvas and d3-geo, rendered by headless Chrome), with an original score played on recorded instruments. No AI image or video model, photograph or stock footage is used.

      All films / 全部影片：https://chanmeng.org/films

      #劉仲敬 #LiuZhongjing #歷史地圖 #HistoryMap #地圖動畫
