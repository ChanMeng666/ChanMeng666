    description: |-
      《十月的微雨》 A Drizzle in October is one of my own songs, and this is its music video. Every frame is drawn by code: a web page draws frame t, headless Chrome captures it, and ffmpeg adds the song. No image or video generation model and no footage is used for the picture.

      The film is cel animation on warm paper, with ink lines redrawn every second frame so they breathe.

      • No face is ever drawn. The rule comes from one line of the lyric, 「把臉龐留在鏡頭之外」 (keeping my face outside the frame).
      • The red scarf is her, the yellow scarf is him.
      • Red pencil marks what never happened.
      • On 「如果時間能倒流」 (if time could run backwards), the rain falls upward.

      The story continues in the second film, 《二月的延长线》 February, on an Extended Line, also on this channel: https://youtu.be/B1q5akx2zPk

