      《独身主义的咖啡》 A Coffee for One is one of my own songs, and this is its music video. Every frame is drawn by code: Python paints the watercolour layers, a web page animates them as a pure function of time, headless Chrome captures every frame, and ffmpeg adds the song. No image or video generation model, no photograph and no footage is used for the picture.

      The film is drawn as procedural pen-and-wash watercolour, with rain on glass.

      • Nine painted sets and 68 layers, all from one small watercolour engine written for these films.
      • Cool against warm: Prussian blue and indigo rain outside, sienna wood and amber lamplight inside.
      • No face is ever drawn: a back, a pair of hands, a reflection in the glass.

      Credits
      Song: Chan Meng, made with Suno.
      Picture: treatment, painting and animation code by Chan Meng, built with Claude Code.
