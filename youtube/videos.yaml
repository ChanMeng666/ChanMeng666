      - https://chanmeng.org/films
      - https://chanmeng.org
      - https://github.com/ChanMeng666
    description: |-
      ArchLang is a declarative language for floor plans, and it lets AI write them as code. You write a .arch file and the compiler turns it into a professional, dimensioned drawing. It is open source, published to npm, and is the compiler engine behind ArchCanvas.

      This film is one take with no cuts. Lines of code become plan lines, the plan rises into a small 3D house, the house folds back into the plan, and the take ends on the logo. The code on screen is ArchLang's own laneway-house example and the plan is what the real compiler produces from it. The 3D house was modelled in Blender from that plan's geometry, for the film. A single three.js file draws every frame, and the score is built from real instrument samples, all CC0 or public domain.

      I'm Chan Meng, an AI agent architect and full-stack engineer in Auckland, New Zealand.

